<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A Ilha dos 25</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="jogo intro">

    <header class="barra-topo">
      <h1>A Ilha dos 25</h1>
      <ul class="estado">
        <li title="Dia">Dia <b id="st-dia">1</b></li>
        <li title="Sobreviventes">Gente <b id="st-gente">25</b></li>
        <li title="Comida">Comida <b id="st-comida">100</b></li>
        <li title="Moral">Moral <b id="st-moral">50</b></li>
        <li title="Quanto a ilha confia na Constituição">Lei <b id="st-lei">50</b></li>
      </ul>
      <button id="btn-menu" class="btn-menu" type="button">Sobreviventes</button>
      <button id="btn-const" class="btn-menu" type="button">Constituição</button>
      <button id="btn-novo" class="btn-menu" type="button">Novo jogo</button>
    </header>

    <section class="cena">
      <canvas id="cena" width="320" height="180"></canvas>
    </section>

    <section class="painel pergunta">
      <h2 id="pergunta-titulo">O naufrágio</h2>
      <p id="pergunta-texto"></p>
      <button id="btn-avancar" type="button" hidden>Avançar dia</button>
    </section>

    <section class="painel resposta">
      <h2>Resposta</h2>
      <textarea id="resposta-campo" aria-label="A tua resposta" rows="3" placeholder="Escreve aqui o que a ilha deve fazer..."></textarea>
      <button id="btn-responder" type="button">Responder!</button>
    </section>

  </main>

  <div id="aviso" hidden></div>

  <div id="const" hidden>
    <dialog class="const-caixa" open aria-label="Constituição da Ilha">
      <div class="const-acoes">
        <button id="const-imprimir" type="button">Imprimir / PDF</button>
        <button id="const-copiar" type="button">Copiar texto</button>
        <button id="const-descarregar" type="button">Descarregar .txt</button>
        <button id="const-fechar" class="btn-menu" type="button">Fechar</button>
      </div>
      <article id="const-doc"></article>
    </dialog>
  </div>

  <div id="menu" hidden>
    <dialog class="menu-caixa" open aria-label="Sobreviventes">
      <button id="menu-fechar" class="fechar" type="button" aria-label="Fechar">X</button>
      <div id="menu-lista"></div>
      <div id="menu-ficha"></div>
    </dialog>
  </div>
  <script src="js/regras.js"></script>
  <script src="js/eventos.js"></script>
  <script src="js/regime.js"></script>
  <script src="js/situacoes.js"></script>
  <script src="js/guardar.js"></script>
  <script src="js/script.js"></script>
  <script src="js/constituicao.js"></script>
</body>
</html>
